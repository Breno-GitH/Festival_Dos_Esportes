<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival Galáctico - 16 Bits</title>
    <!-- Fonte 16-Bits inspirada em jogos clássicos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2.2">
</head>
<body>
    <div id="game-container">
        <!-- Interface Superior -->
        <div id="header-ui">
            <h1 id="game-title">ILHA DOS CAMPEOES</h1>
            <div id="score-tag">PONTOS: <span id="score-val">0</span></div>
        </div>
        
        <!-- Tela de Jogo -->
        <div id="canvas-wrapper">
            <!-- Resolução interna menor (450x300) para criar efeito Pixel Art natural -->
            <canvas id="gameCanvas" width="450" height="300" tabindex="0" aria-label="Área jogável do Festival Galáctico"></canvas>
            
            <!-- Caixa de Diálogo (Estilo RPG) -->
            <div id="dialog-box">
                <p id="dialog-text"></p>
            </div>
        </div>

        <div id="controls-hint">
            <p id="hint-text">Use [W A S D] PARA MOVER | [E] PARA INTERAGIR</p>
        </div>
    </div>

    <script src="archery_assets/archery_assets_manifest.js?v=2.0.0_archery_runtime"></script>
    <script src="archery_asset_registry.js?v=2.2.0_archery_island"></script>
    <script src="medalhas_registry.js?v=1.1_surf_fix"></script>
    <script src="boxing_arena.js?v=3.1_boxing_medal"></script>
    <script src="script.js?v=9.2_mestre_skate"></script>
    <script src="basketball_1v1.js?v=1.0.1_visual_fix"></script>
    <script src="skate_endless.js?v=3.1_mestre_aspect"></script>
    <script src="corrida_maratona.js?v=2.1_free_ai_obstacles"></script>
    <script src="surf_asset_registry.js?v=1.2.0_score_signs"></script>
    <script src="surf_endless.js?v=9.5.0_surf_fix"></script>
</body>
</html>
