    <div id="game-container">
        <!-- Interface Superior -->
        <div id="header-ui">
            <h1 id="game-title">ILHA DOS CAMPEOES</h1>
            <div id="header-tools">
                <section id="jukebox-mini" aria-label="Reprodutor da jukebox" data-muted="false" hidden>
                    <div class="jukebox-disc" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
                    <div class="jukebox-copy">
                        <span id="jukebox-state">JUKEBOX · TOCANDO</span>
                        <strong id="jukebox-track" aria-live="polite"></strong>
                    </div>
                    <button id="jukebox-next" type="button" aria-label="Próxima faixa" title="Próxima faixa">
                        <svg viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges"><path d="M2 3v10l6-5zM8 3v10l6-5z" fill="currentColor"/></svg>
                    </button>
                    <button id="jukebox-mute" type="button" aria-label="Silenciar música" aria-pressed="false" title="Silenciar música">
                        <svg viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges"><path d="M1 6h3l4-3v10l-4-3H1z" fill="currentColor"/><path class="sound-waves" d="M10 5h2v6h-2V9h1V7h-1zM13 3h1v10h-1z" fill="currentColor"/><path class="sound-off" d="m10 5 1-1 5 7-1 1zM10 11l5-7 1 1-5 7z" fill="currentColor"/></svg>
                    </button>
                </section>
                <div id="coin-counter" role="status" aria-live="polite" aria-atomic="true" aria-label="Moedas: 0">
                    <canvas id="coin-icon" width="32" height="32" aria-hidden="true"></canvas>
                    <span id="coin-value">0</span>
                    <span id="coin-feedback" role="status" aria-live="polite"></span>
                </div>
            </div>
        </div>
        
        <!-- Tela de Jogo -->
        <div id="canvas-wrapper">
            <!-- Resolução interna menor (450x300) para criar efeito Pixel Art natural -->
            <canvas id="gameCanvas" width="450" height="300" tabindex="0" aria-label="Área jogável do Festival Galáctico"></canvas>
            
            <!-- Caixa de Diálogo (Estilo RPG) -->
            <div id="dialog-box">
                <p id="dialog-text"></p>
            </div>
        </div>

        <div id="controls-hint">
            <p id="hint-text">Use [W A S D] PARA MOVER | [E] PARA INTERAGIR</p>
        </div>
    </div>
